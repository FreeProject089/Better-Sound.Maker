<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Better Sound.Maker</title>
  <meta name="description"
    content="Better Sound.Maker — Create DCS World sound mods easily. Select assets, upload audio, edit SDEF files, and build complete mods." />
  <link rel="icon" type="image/png" href="./BSM.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    /* First paint = the intro background (full styles: src/intro/intro.css) */
    #bsm-intro { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #0a0e17; }
    html, body { background: #0a0e17; }
  </style>
</head>

<body>
  <div id="bsm-intro" role="status" aria-busy="true" aria-label="Better Sound.Maker">
    <div class="bi-stage">
      <div class="bi-tasky">
        <img class="bi-idle" src="./Tasky.webp" alt="" draggable="false" />
        <img class="bi-happy" src="./Tasky_Happy.webp" alt="" draggable="false" />
      </div>
      <div class="bi-brand"><span class="bi-w1">Better </span><span class="bi-w2">Sound.Maker</span></div>
      <div class="bi-eq" aria-hidden="true">
        <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
        <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span><span style="--i:7"></span>
      </div>
      <div class="bi-status" id="loader-text"></div>
      <div class="bi-sub" id="loader-subtext"></div>
    </div>
    <div class="bi-foot" id="bi-version"></div>
  </div>

  <script>
    (function () {
      var fr = (localStorage.getItem('dcs-sound-mod-creator::language') || 'en') === 'fr';
      var t = document.getElementById('loader-text');
      if (t) t.textContent = fr ? 'Chargement de Better Sound.Maker…' : 'Loading Better Sound.Maker…';
    })();
  </script>
  <!-- Mobile hamburger button -->
  <button id="sidebar-toggle" aria-label="Toggle menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  <!-- Sidebar overlay (mobile) -->
  <div id="sidebar-overlay"></div>

  <div id="app">
    <nav id="sidebar"></nav>
    <main id="main-content">
      <div id="page-container"></div>
    </main>
  </div>
  <div id="toast-container"></div>
  <div id="modal-overlay" class="hidden"></div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
