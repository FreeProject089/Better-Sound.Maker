[package]
name = "better-sound-maker"
version = "1.0.10"
description = "Better Sound.Maker — Create DCS World sound mods easily"
authors = ["FreeProject089"]
license = "SEE LICENSE IN LICENSE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "better_sound_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
